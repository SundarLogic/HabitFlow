# Continuous integration: tests every push to main and every pull request (ADR-061).
# CI only TESTS; Vercel and Render deploy from GitHub by themselves. With branch protection
# ("Require status checks to pass", docs/DEPLOYMENT.md) and Render's autoDeployTrigger:
# checksPass (render.yaml), a red build never reaches production.
#
# The database password below is a throwaway for the disposable CI container, not a secret.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older, still-running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The production runtime (Render, Vercel build, Docker image).
  NODE_VERSION: "20"
  # The frontend test tools (Vitest 5, jsdom 30, MSW 3) need Node 22.12+ (ADR-063).
  NODE_TEST_VERSION: "22"
  TEST_DATABASE_URL: postgres://habitflow:ci-only-password@localhost:5432/habitflow_test
  CLIENT_ORIGINS: http://localhost:5173

jobs:
  backend:
    name: Backend (lint, tests, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habitflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: habitflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habitflow -d habitflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Migrates the test database, runs unit + integration tests, enforces coverage thresholds.
      - run: npm run test:coverage

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_TEST_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The same build Vercel runs (framework Vite, output dist/), on the production Node version.
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node --version && npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: habitflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: habitflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habitflow -d habitflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Starts its own API (:3100, test DB) and Vite (:5174); desktop, Pixel 5 and 375 px.
      - run: npm run test:e2e
        working-directory: frontend
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  audit:
    name: npm audit (fail on high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Reads package-lock.json; no install needed. Fails on high or critical advisories.
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: frontend
