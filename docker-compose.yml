# Local development services. All credentials come from the root .env file
# (copy .env.example -> .env). Compose refuses to start if a required value is missing.
name: habitflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: habitflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Default database created by the image; the init script also creates the test database.
      POSTGRES_DB: ${POSTGRES_DEV_DB:?POSTGRES_DEV_DB must be set in .env}
      POSTGRES_DEV_DB: ${POSTGRES_DEV_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?POSTGRES_TEST_DB must be set in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - habitflow_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DEV_DB}\" && psql -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_TEST_DB}\" -c 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  habitflow_pgdata:
    name: habitflow_pgdata
