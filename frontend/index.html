<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="HabitFlow: build habits that stick." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA basics (Phase 11): installable with a name, icons and colours. No service worker or
         offline sync yet (PRD: PWA improvements come later). Regenerate icons with
         node scripts/generate-icons.js. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Browser UI colour matches the app background in each colour scheme. -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <title>HabitFlow</title>
    <script>
      // Apply the saved theme BEFORE the page paints, so dark-mode users never see a white flash.
      // Must match lib/theme.js (key "hf-theme": "light" | "dark" | "system").
      (function () {
        try {
          var saved = localStorage.getItem('hf-theme') || 'system';
          var dark =
            saved === 'dark' ||
            (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* storage blocked: fall back to the light theme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
